<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <title>You're offline · ZenixMind</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#050506;color:#f4f4f5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.panel{width:min(100%,440px);padding:32px;border:1px solid #27272a;border-radius:24px;background:#0d0d0f;text-align:center}.mark{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 24px;border:1px solid #3f3f46;border-radius:15px;font-weight:800;letter-spacing:-.08em}.eyebrow{color:#a1a1aa;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}h1{margin:12px 0;font-size:28px;letter-spacing:-.04em}p{color:#a1a1aa;line-height:1.65;font-size:14px}.button{display:inline-flex;margin-top:16px;padding:12px 20px;border-radius:999px;background:#f4f4f5;color:#09090b;text-decoration:none;font-size:14px;font-weight:700}
  </style>
</head>
<body>
  <main class="panel">
    <div class="mark" aria-hidden="true">Z</div>
    <div class="eyebrow">ZenixMind</div>
    <h1>You're offline</h1>
    <p>ZenixMind couldn't reach the internet. Your account and saved files have not been changed. Reconnect to continue your conversations and access your Library.</p>
    <a class="button" href="/">Try again</a>
  </main>
</body>
</html>
